<div style="flex:1;min-width:320px;">
<div class="card">
  <div class="step-title"><span class="step-num">1</span>粘贴命令输出</div>
  <div class="tip-box">&#128161; 把设备上 <code>display ospf peer brief</code> 等命令的实际返回内容粘贴到下方，AI会自动识别数据格式并推荐规则。</div>
  <div class="fr"><label>巡检项名称 *</label><input id="i-name" placeholder="查看OSPF邻居数"></div>
  <div class="fr"><label>执行命令 *</label><input id="i-cmd" placeholder="display ospf peer brief"></div>
  <div class="fr"><label>命令实际输出（粘贴设备返回结果）*</label><textarea id="i-output" rows="12" placeholder="粘贴设备命令输出内容..."></textarea></div>
  <div style="display:flex;gap:10px;">
    <button class="btn-p" onclick="doAnalyze()">&#128269; AI分析规则</button>
    <button class="btn-s" onclick="clearForm()">清空</button>
  </div>
</div>
<div class="card" id="result-card" style="display:none;">
  <div class="step-title"><span class="step-num">2</span>AI分析结果 <small style="font-weight:400;font-size:.8rem;color:#57606a;">可手动调整后加入列表</small></div>
  <div class="result-box">
    <div class="rb-row"><span class="rb-label">解析器</span><span id="r-parser"></span></div>
    <div class="rb-row"><span class="rb-label">解析器配置</span><code id="r-pcfg" style="font-size:.79rem;word-break:break-all;"></code></div>
    <div class="rb-row"><span class="rb-label">检查器</span><span id="r-checker"></span></div>
    <div class="rb-row"><span class="rb-label">检查器配置</span><code id="r-ccfg" style="font-size:.79rem;word-break:break-all;"></code></div>
  </div>
  <div class="reason-box" id="r-reason"></div>
  <div style="margin-top:14px;">
    <div class="fr"><label>异常提示（可修改）</label><input id="r-note" placeholder="请检查"></div>
    <div class="fr"><label>绑定到分组（可选）</label>
      <select id="r-group">
        <option value="">-- 不绑定 --</option>
        {% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
      </select>
    </div>
    <button class="btn-p" onclick="addToList()">+ 加入导入列表</button>
  </div>
</div>
</div>
<div style="flex:1;min-width:320px;">
<div class="card">
  <div class="step-title"><span class="step-num">3</span>待导入列表 <small id="list-cnt" style="font-weight:400;font-size:.8rem;color:#57606a;">0 项</small></div>
  <div id="import-list">
    <div style="text-align:center;color:#8c959f;padding:32px;font-size:.88rem;">暂无内容，请在左侧分析后加入</div>
  </div>
  <div style="margin-top:14px;display:flex;gap:10px;">
    <button class="btn-p" id="btn-import" onclick="doImport()" disabled>&#8659; 确认批量导入</button>
    <button class="btn-s" onclick="clearList()">清空列表</button>
  </div>
</div>
<div class="card" id="import-result" style="display:none;">
  <div class="step-title"><span class="step-num" style="background:#1a7f37;">&#10003;</span>导入完成</div>
  <div id="import-msg"></div>
  <div style="margin-top:12px;"><a href="/new/checkitem/list/" class="btn btn-default">查看巡检项列表</a></div>
</div>
</div>
</div>
</div>
{% endblock %}
