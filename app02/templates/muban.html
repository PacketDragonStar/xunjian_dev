{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{% static 'plugins/bootstrap-3.4.1/css/bootstrap.css' %}">
    <style>
         .hidden-column {
        display: none; /*隐藏列*/
    }
           .con1 {
               height: max-content;
               width: 300px;
           }
    .con3{
        overflow: hidden; /* 清除浮动 */
    }
  .clear {
    clear: both; /* 清除浮动 */
  }

                   .con2{
    height:100px;
    width:700px;
  }
         .flex-container {
    display: flex;
    flex-direction: column; /* 设置为垂直布局 */
  }
         a {
    color: black;
    text-decoration: none; /* 如果你想要去除下划线，可以加上这一行 */
}

/* 当鼠标悬停在超链接上时，改变其颜色为蓝色 */
a:hover {
    color: blue;
}

        .progress {
            width: 50%;
            margin: 20px auto;
        }

        .progress-bar {
            background-color: #007bff;
            height: 30px;
            line-height: 30px;
            text-align: center;
            color: white;
        }

        .con111 {
            display: grid;
            align-items: center; /* 垂直居中 */
            height: 100px; /* 或者其他高度 */
            height: 80px;
            gap: 50px;
        }
        .btn-outline-primary + .btn-outline-primary {
            margin-left: 10px; /* 根据需要调整间距大小 */
        }


    </style>
    <script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>
</head>
<body>
<nav class="navbar navbar-inverse">
{#<nav class="navbar navbar-inverse">#}
  <div class="container-fluid">
    <!-- Brand and toggle get grouped for better mobile display -->
    <div class="navbar-header">
      <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#bs-example-navbar-collapse-1" aria-expanded="false">
        <span class="sr-only">Toggle navigation</span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
        <span class="icon-bar"></span>
      </button>
      <a class="navbar-brand" href="/info/list/">巡检系统</a>
    </div>
<div class="container">
    <!-- Collect the nav links, forms, and other content for toggling -->
    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-1">
      <ul class="nav navbar-nav">
        <li class="active"><a href="/info/list/">网络巡检 <span class="sr-only">(current)</span></a></li>
          <li><a href="#">主机巡检</a></li>
        <li><a href="/search/history/">巡检历史</a></li>
          <li><a href="/admin/list/">人员管理</a></li>
          <li><a href="/admin/list/">设备管理</a></li>
          </ul>
      <ul class="nav navbar-nav navbar-right">
        <li class="dropdown">
          <a href="#" class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true" aria-expanded="false">{{ request.session.info.name }} <span class="caret"></span></a>
          <ul class="dropdown-menu">
            <li><a href="#">Action</a></li>
            <li><a href="#">Another action</a></li>
            <li><a href="#">Something else here</a></li>
            <li role="separator" class="divider"></li>
            <li><a href="#">Separated link</a></li>
          </ul>
        </li>
      </ul>
    </div><!-- /.navbar-collapse -->
  </div><!-- /.container-fluid -->
  </div>
</nav>
<div>
    {% block content %}-{% endblock %}
</div>
<script src="{% static 'js/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'plugins/bootstrap-3.4.1/js/bootstrap.min.js' %}"></script>
<script type="text/javascript"></script>
</body>
</html>
