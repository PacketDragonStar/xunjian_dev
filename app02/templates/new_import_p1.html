{% extends "layout.html" %}
{% load static %}
{% block css %}
<style>
:root{--a:#0969da;--bd:#d0d7de;--c:#fff;--p:#f6f8fa;--ok:#1a7f37;--wn:#9a6700;--fl:#cf222e;}
body{background:var(--p);font-family:"Segoe UI","Microsoft YaHei",sans-serif;}
.pw{max-width:1100px;margin:0 auto;padding:26px 16px;}
.card{background:var(--c);border:1px solid var(--bd);border-radius:8px;padding:22px 24px;margin-bottom:20px;}
.step-num{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;background:var(--a);color:#fff;border-radius:50%;font-size:.82rem;font-weight:700;flex-shrink:0;}
.step-title{font-size:1rem;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.fr{margin-bottom:12px;}
.fr label{display:block;font-size:.78rem;font-weight:600;color:#57606a;margin-bottom:3px;}
.fr input,.fr select,.fr textarea{width:100%;border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:.86rem;box-sizing:border-box;}
.fr textarea{font-family:Consolas,monospace;font-size:.8rem;resize:vertical;}
.btn-p{background:var(--a);color:#fff;border:none;padding:8px 22px;border-radius:6px;font-size:.88rem;cursor:pointer;}
.btn-p:hover{background:#0550ae;} .btn-p:disabled{background:#8c959f;cursor:not-allowed;}
.btn-s{background:transparent;border:1px solid var(--bd);padding:8px 18px;border-radius:6px;font-size:.88rem;cursor:pointer;}
.result-box{background:#f6f8fa;border:1px solid var(--bd);border-radius:6px;padding:14px;}
.rb-row{display:grid;grid-template-columns:130px 1fr;gap:5px 12px;align-items:start;margin-bottom:6px;font-size:.84rem;}
.rb-label{font-size:.74rem;font-weight:600;color:#57606a;text-transform:uppercase;letter-spacing:.04em;padding-top:3px;}
.bk{padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600;}
.bk-b{background:#ddf4ff;color:#0550ae;} .bk-g{background:#dafbe1;color:#1a7f37;}
.bk-o{background:#fff1e5;color:#bc4c00;} .bk-p{background:#fbefff;color:#8250df;}
.bk-gray{background:#f3f4f6;color:#57606a;}
.reason-box{background:#fffbdd;border:1px solid #e3b341;border-radius:6px;padding:10px 14px;font-size:.83rem;color:#7d4e00;margin-top:10px;}
.item-card{background:#f8fbff;border:1px solid #b6d4f7;border-radius:6px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.item-card .info{flex:1;font-size:.83rem;}
.item-card .info strong{display:block;margin-bottom:2px;}
.item-card .del{background:none;border:none;color:#cf222e;cursor:pointer;font-size:1.1rem;padding:0 4px;}
.tip-box{background:#f0f6ff;border:1px solid #b6d4f7;border-radius:6px;padding:12px 14px;font-size:.83rem;color:#0550ae;margin-bottom:16px;}
</style>
{% endblock %}
{% block content %}
<div class="pw">
<nav aria-label="breadcrumb" style="margin-bottom:14px;">
  <ol class="breadcrumb" style="background:transparent;padding:0;margin:0;">
    <li class="breadcrumb-item"><a href="/new/history/">巡检历史</a></li>
    <li class="breadcrumb-item"><a href="/new/checkitem/list/">巡检项管理</a></li>
    <li class="breadcrumb-item active">AI批量导入</li>
  </ol>
</nav>
<h4 style="margin:0 0 6px;font-weight:700;">AI辅助批量导入巡检项</h4>
<p style="color:#57606a;font-size:.88rem;margin-bottom:20px;">粘贴设备命令的实际输出，系统自动推断最合适的解析器和检查规则，批量生成巡检项配置。</p>
