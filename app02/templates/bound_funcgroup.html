{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href ="{% static 'plugins/bootstrap-5.3.0/css/bootstrap.css' %}">
    <style>
    .container {

    }
    .div1, .div2 {
        float: left;
        width: 45%; /* 或者你可以设置具体的宽度 */
    }
        .div3-container {
        display: flex;
        justify-content: center; /* 水平居中 */
        align-items: center; /* 垂直居中 */
    }
    .div3{
        float: left;
        width: 10%; /* 或者你可以设置具体的宽度 */
    }

</style>
</head>
<body>
<div class="container">
<form method="post">
{% csrf_token %}
    <div class="div1">
        <label for="func">选择函数:</label>
        <select multiple name="func" id="func"  class="form-control" size="20">
            {% for func in func_list %}
                <option value="{{ func.func }}">{{ func.func }}</option>
            {% endfor %}
        </select>
    </div>
<div class="div3"> <button type="submit"  id="button1" class="button-class">确定</button></div>
    <div class="div3"> <button type="submit"  name ='button2' class="button-class">绑定</button></div>

  <label for="func">绑定函数:</label>
        <select multiple name="func1" id="func"  class="form-control" size="20">
            {% for func in selected_funcs %}
                <option value="{{ func}}">{{ func }}</option>
            {% endfor %}
        </select>

    <div class="div2">
        <label for="group_id">选择组:</label>
        <select name="group_id" id="group_id"  class="form-control">
            {% for group in group_list %}
                <option value="{{ group.id }}">{{ group.group_name}}</option>
            {% endfor %}
        </select>
    </div>
</form>
</div>

</body>


</html>
