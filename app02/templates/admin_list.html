{% extends 'layout.html' %}

{% block content %}

    <div class="container">
        <div style="margin-bottom: 10px" class="clearfix">
{#            <a class="btn btn-success" href="/admin/add/">#}
{#                <span class="glyphicon glyphicon-plus-sign" aria-hidden="true"></span>#}
{#                新建用户#}
{#            </a>#}
      <a href="/admin/add/">
                <input type="button" value="testadd" class="btn btn-outline-primary"/>
            </a>
            <div style="float: right;width: 300px;">
                <form method="get">
                    <div class="input-group">
                        <input type="text" name="query" class="form-control" placeholder="关键字"
                               value="{{ search_data }}">
                        <span class="input-group-btn">
                        <button class="btn btn-default" type="submit">
                            <span class="glyphicon glyphicon-search" aria-hidden="true"></span>
                        </button>
                      </span>
                    </div>
                </form>
            </div>

        </div>
        <div class="panel panel-default">
            <!-- Default panel contents -->
            <div class="panel-heading">
                <span class="glyphicon glyphicon-th-list" aria-hidden="true"></span>
                账号信息
            </div>

            <!-- Table -->
            <table class="table table-bordered">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>密码</th>
                    <th>姓名</th>
                    <th>手机号码</th>
                    <th>所属部门</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                {% for obj in queryset %}
                    <tr>
                        <th>{{ obj.id }}</th>
                        <td>{{ obj.username }}</td>
                        <td>********</td>
                        <td>{{obj.name}}</td>
                        <td>{{obj.phone}}</td>
                        <td>{{ obj.depart.title }}</td>
                        <td>
                            <a class="btn btn-primary btn-xs" href="/admin/{{ obj.id }}/edit/">编辑</a>
                            <a class="btn btn-warning btn-xs" href="/admin/{{ obj.id }}/reset/">重置密码</a>
{#                            <a class="btn btn-danger btn-xs" href="/admin/{{ obj.id }}/delete/">删除</a>#}

                        </td>
                    </tr>
                {% endfor %}

                </tbody>
            </table>

        </div>

        <ul class="pagination" style="float: right">
            {{ page_string }}
        </ul>
    </div>

{% endblock %}
