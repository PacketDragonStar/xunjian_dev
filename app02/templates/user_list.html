{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>巡检系统</title>
    <link rel="stylesheet" href ="{% static 'plugins/bootstrap-4.6.2-dist/css/bootstrap.css' %}">
    <style>
         .hidden-column {
             display: none; /*隐藏列*/
         }
         .progress {
            width: 50%;
            margin: 20px auto;
        }

        .progress-bar {
            background-color: #007bff;
            height: 30px;
            line-height: 30px;
            text-align: center;
            color: white;
        }
        .con111 {
              display: grid;
                align-items: center; /* 垂直居中 */
                height: 100px; /* 或者其他高度 */
            height: 80px;
             gap: 50px;
         .btn-outline-primary + .btn-outline-primary {
                margin-left: 10px; /* 根据需要调整间距大小 */
        }
        }


    </style>
     <script src="{% static 'js/jquery-3.6.0.min.js'%}"></script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <nav class="navbar navbar-expand-lg navbar-light bg-dark">
    <a class="navbar-brand" href="/info/list/">巡检系统</a>
        </nav>
<div class="container" background-color: red;>
  <nav class="navbar navbar-expand-lg navbar-light bg-dark">
      <div class="container">
      <a class="navbar-brand" href="/info/list/">巡检</a>
      <a class="navbar-brand" href="/search/history/">巡检历史</a>
      <a class="navbar-brand" href="#">人员管理</a>
      </div>
    <form class="d-flex">
      <input type="text" class="form-control me-2" placeholder="Search">
    </form>
  </nav>
</div>

</nav>
<div class="container">
<div class="con111">
    <h5>你好，张三！当前基线文件为2024-06-06 15:39:39.515410
    <button type="button" class="btn btn-outline-primary">开始巡检</button>
    <button type="button" class="btn btn-outline-primary">测试连接</button>
    <a href="/info/add/" >
                  <input type="button" value="添加设备" class="btn btn-outline-primary" />
    </a>
        </h5>
</div>
</div>
<div class="container">
    <table class="table table-bordered">
  <thead >
    <tr>
      <th scope="col" class="hidden-column">序号</th>
      <th scope="col">设备名称</th>
      <th scope="col">设备IP</th>
        <th scope="col">设备组</th>
        <th scope="col" class="hidden-column">用户名</th>
        <th scope="col" class="hidden-column">密码</th>
      <th scope="col">编辑</th>
        <th scope="col">删除</th>
    </tr>
  </thead>
  <tbody>
  {% for item in data_list %}
  <tr>
      <th scope="row" class="hidden-column">{{item.id}}</th>
      <td>{{item.name}}</td>
      <td>{{item.hostname}}</td>
      <td>{{item.group}}</td>
      <td class="hidden-column">{{item.user}}</td>
      <td class="hidden-column">{{item.password}}</td>
      <td>
          <a href="/info/{{item.id}}/edit/">
              <button  type="button" class="btn btn-outline-primary btn-sm">编辑</button>
      </td>
      <td>
          </a>
          <a href="/info/delete/?nid={{item.id}}">
              <button type="button" class="btn btn-outline-danger btn-sm">删除</button>
          </a>

      </td>
  </tr>
          {% endfor %}
</div>












  </tbody>
</table>
          </div>
     <script src="{% static 'js/jquery-min.js' %}"></script>
        <script src="{% static 'plugins/bootstrap-4.6.2-dist/js/bootstrap.js' %}"></script>
     <script type="text/javascript">

     </script>
</body>
</html>
